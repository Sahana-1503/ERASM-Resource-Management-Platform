spring.application.name=ERASM

spring.datasource.url=jdbc:mysql://localhost:3306/erasm
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8090

# Logging Configuration
logging.level.root=INFO
logging.level.com.erasm=DEBUG

# Log file
logging.file.name=logs/erasm.log

# Log pattern for file
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Log pattern for console
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n